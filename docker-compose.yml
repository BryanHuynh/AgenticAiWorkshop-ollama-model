name: ${COMPOSE_PROJECT_NAME:-agentic-ai-workshop}
services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
      args:
        MODEL: ${MODEL:-llama3.1:8b}
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - default
      
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    ports:
      - "${OLLAMA_WEB_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:${OLLAMA_PORT:-11434}
    volumes:
      - ollama_webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - default

volumes:
  ollama_data:
  ollama_webui_data:

networks:
  default:
    name: workshop-shared-network
    external: true