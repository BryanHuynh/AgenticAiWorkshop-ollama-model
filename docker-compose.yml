name: ${COMPOSE_PROJECT_NAME:-agentic-ai-workshop}
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "ollama list | tail -n +2 | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s  

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    ports:
      - "${OLLAMA_WEB_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:${OLLAMA_PORT:-11434}
    volumes:
      - ollama_webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

volumes:
  ollama_data:
  ollama_webui_data:

networks:
  default:
    name: workshop-shared-network
    external: true